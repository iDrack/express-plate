name: Test and Build Production Artifact without .env

on:
    push:
        branches: [main, master]
    workflow_dispatch:

jobs:
    test:
        runs-on: ubuntu-latest
        
        services:
            postgres:
                image: postgres:16
                env:
                    POSTGRES_USER: test_user
                    POSTGRES_PASSWORD: test_password
                    POSTGRES_DB: test_db
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd pg_isready
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5

            redis:
                image: redis:7-alpine
                ports:
                    - 6379:6379
                options: >-
                    --health-cmd "redis-cli ping"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '18'
                  cache: 'npm'

            - name: Install dependencies
              run: |
                  npm ci
                  npm install --save-dev node-ts

            - name: Create test .env file
              run: |
                  cat > .env << EOF
                  NODE_ENV=test
                  APP_PORT=3000
                  DATABASE_HOST=localhost
                  DATABASE_PORT=5432
                  DATABASE_USER=test_user
                  DATABASE_PASSWORD=test_password
                  DATABASE_NAME=test_db
                  REDIS_HOST=localhost
                  REDIS_PORT=6379
                  JWT_SECRET=test_jwt_secret_key_for_testing_only
                  JWT_EXPIRES_IN=1h
                  JWT_REFRESH_SECRET=test_refresh_secret_key_for_testing_only
                  JWT_REFRESH_EXPIRES_IN=7d
                  LOG_LEVEL=6
                  EOF

            - name: Run linting
              run: npm run lint || true

            - name: Run unit tests
              run: npm run test

            - name: Generate test coverage
              run: npm run test:coverage || npm test -- --coverage || echo "No coverage script found"

    build-artifact:
        runs-on: ubuntu-latest
        needs: test
        if: success()

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Create production directory
              run: |
                  mkdir -p production-deploy

            - name: Build Docker image and save as tar
              run: |
                  docker build -t ${{ secrets.DOCKER_CONTAINER_NAME || 'express-plate' }}:latest .
                  docker save ${{ secrets.DOCKER_CONTAINER_NAME || 'express-plate' }}:latest -o production-deploy/app-image.tar

            - name: Copy project files
              run: |
                  cp docker-compose.yml production-deploy/
                  cp README.md production-deploy/
                  cp -r docker/ production-deploy/ 2>/dev/null || true

            - name: Copy deployment script
              run: |
                  cp deploy.sh production-deploy                  
                  chmod +x production-deploy/deploy.sh

            - name: Upload production image
              uses: actions/upload-artifact@v4
              with:
                  name: app-image
                  path: production-deploy/app-image.tar
                  retention-days: 30

            - name: Upload deployment files
              uses: actions/upload-artifact@v4
              with:
                  name: app-production
                  path: production-deploy/
                  retention-days: 7
                  include-hidden-files: true